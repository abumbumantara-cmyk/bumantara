```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemesanan Kendaraan</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      padding:30px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .produk{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:#fafafa;
      border:1px solid #ddd;
      border-radius:10px;
      padding:15px;
      text-align:center;
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .card img{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:8px;
    }

    .card h3{
      margin:10px 0;
      color:#222;
    }

    .card p{
      margin-bottom:10px;
      color:#666;
    }

    .btn{
      background:#007bff;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:6px;
      cursor:pointer;
    }

    .btn:hover{
      background:#0056b3;
    }

    form{
      margin-top:20px;
    }

    form input, form select{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:6px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:25px;
    }

    table th, table td{
      border:1px solid #ccc;
      padding:12px;
      text-align:center;
    }

    table th{
      background:#007bff;
      color:white;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Website Pemesanan Mobil & Motor</h1>

    <!-- Produk -->
    <div class="produk">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="Mobil">
        <h3>Mobil Toyota</h3>
        <p>Harga Sewa: Rp500.000 / hari</p>
        <button class="btn" onclick="pilihKendaraan('Mobil Toyota')">Pesan</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39" alt="Motor">
        <h3>Motor Sport</h3>
        <p>Harga Sewa: Rp150.000 / hari</p>
        <button class="btn" onclick="pilihKendaraan('Motor Sport')">Pesan</button>
      </div>

    </div>

    <!-- Form Pemesan -->
    <h2>Form Data Pemesan</h2>

    <form id="formPemesanan">
      <input type="text" id="nama" placeholder="Masukkan Nama" required>

      <input type="text" id="alamat" placeholder="Masukkan Alamat" required>

      <input type="tel" id="telepon" placeholder="Masukkan Nomor Telepon" required>

      <input type="text" id="kendaraan" placeholder="Kendaraan Dipilih" readonly required>

      <button type="submit" class="btn">Simpan Data</button>
    </form>

    <!-- Tabel Data -->
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Alamat</th>
          <th>No Telepon</th>
          <th>Kendaraan</th>
        </tr>
      </thead>

      <tbody id="dataPemesan">
      </tbody>
    </table>

  </div>

  <script>
    function pilihKendaraan(namaKendaraan){
      document.getElementById("kendaraan").value = namaKendaraan;
    }

    const form = document.getElementById("formPemesanan");
    const tabel = document.getElementById("dataPemesan");

    form.addEventListener("submit", function(e){
      e.preventDefault();

      const nama = document.getElementById("nama").value;
      const alamat = document.getElementById("alamat").value;
      const telepon = document.getElementById("telepon").value;
      const kendaraan = document.getElementById("kendaraan").value;

      const row = `
        <tr>
          <td>${nama}</td>
          <td>${alamat}</td>
          <td>${telepon}</td>
          <td>${kendaraan}</td>
        </tr>
      `;

      tabel.innerHTML += row;

      form.reset();
    });
  </script>

</body>
</html>
```
